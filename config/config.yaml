# ── Input lane files ──────────────────────────────────────────────────────────
lane_r1: "/hpc/local/Rocky8/prekovic/BRB/ERC_results/BRB_16_ERC_1.fq.gz"
lane_r2: "/hpc/local/Rocky8/prekovic/BRB/ERC_results/BRB_16_ERC_2.fq.gz"

# ── Barcode / sample metadata ─────────────────────────────────────────────────
brb_barcodes:    "/hpc/local/Rocky8/prekovic/BRB/clean/config/alitheia_brb_barcodes_v5D_384_brb.txt"
demultiplex_tsv: "/hpc/local/Rocky8/prekovic/BRB/ERC_results/ERC_demultiplex_file.tsv"

# ── Reference ─────────────────────────────────────────────────────────────────
# For human, use:
star_genome_dir: "/hpc/local/Rocky8/prekovic/common_files/gencode_release48/STAR_index_GRCh38_GENCODE48_basic"   # pre-built STAR index   
gtf: "/hpc/local/Rocky8/prekovic/RNA-seq_pipeline/gencode.v48.annotation.gtf"

# For mouse, use:
#star_genome_dir: "/hpc/local/Rocky8/prekovic/common_files/gencode_releaseM37_GRCm39/STAR_index"
#gtf: "/hpc/local/Rocky8/prekovic/common_files/gencode_releaseM37_GRCm39/gencode.vM37.basic.annotation.gtf" 

#genome_fasta:    "/hpc/local/Rocky8/prekovic/common_files/gencode_release48/GRCh38.primary_assembly.genome.fa"

# ── Output directories ────────────────────────────────────────────────────────
# STARsolo does not produce per-sample FASTQs — demux is internal.
# Structure:
#   result_dir/
#   ├── qc/          ← FastQC + MultiQC
#   ├── fastq/       ← (unused in this pipeline; STARsolo demuxes internally)
#   ├── starsolo/    ← STAR logs, Solo.out/, whitelist, barcode mapping
#   ├── bams/        ← sorted BAM + BAI
#   ├── counts/      ← reformatted genes x samples TSV
#   ├── logs/        ← per-rule logs
#   └── benchmarks/  ← per-rule benchmarks

result_dir: "/hpc/local/Rocky8/prekovic/BRB/ERC_results/new_barcodes_mehmet"

# Set to True to generate and sort BAM files (takes more time)
# Set to False to skip BAM generation and only get count matrices
generate_bam: False

# ── BRB-seq / STARsolo parameters ─────────────────────────────────────────────
barcode_len: 14   # V5D kit: 14 bp barcode in R2
umi_len:     14    # V5D kit: 14 bp UMI following barcode in R2

# ── Thread allocation ─────────────────────────────────────────────────────────
threads:
  star:   16
#  counts: 8
  fastqc: 2

# ── Containers (verify tags) ──────────────────────────────────────────────────
containers:
  fastqc:      "docker://quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0"
  multiqc:     "docker://quay.io/biocontainers/multiqc:1.33--pyhdfd78af_0"
  star:        "docker://quay.io/biocontainers/star:2.7.11b--h5ca1c30_8"
#  subread:     "docker://quay.io/biocontainers/subread:2.1.1--h577a1d6_0"
  python:      "docker://python:3.11.15-trixie"
  samtools:    "docker://quay.io/biocontainers/samtools:1.23--h96c455f_0"
#  pandas:      "docker://quay.io/biocontainers/pandas:2.0.3--py311hdfd78af_0"
  anaconda:    "docker://continuumio/anaconda3:main"
  r_env:       "docker://rocker/tidyverse:4.6.0"
