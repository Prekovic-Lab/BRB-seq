# ── Input lane files ──────────────────────────────────────────────────────────
lane_r1: "/path/to/lane_r1_all_merged_1.fq.gz"
lane_r2: "/path/to/lane_r1_all_merged_2.fq.gz"

# ── Barcode / sample metadata ─────────────────────────────────────────────────
brb_barcodes:    "./config/alitheia_brb_barcodes_v5D_384_brb.txt"
demultiplex_tsv: "./template_demultiplex_file.tsv"

# ── Reference ─────────adjust accordingly──────────────────────────────────────
# For human, use:
# star_genome_dir: "/hpc/local/Rocky8/prekovic/common_files/gencode_release48/STAR_index_GRCh38_GENCODE48_basic"   # pre-built STAR index   

# For mouse, use:
star_genome_dir: "/hpc/local/Rocky8/prekovic/common_files/gencode_releaseM37_GRCm39/STAR_index"

# results folder 
result_dir: "/path/to/your/results_dir"

# Deduplication of UMIs
UMIs_dedup: True   # Set to True to deduplicate UMIs (default for BRB-seq)

# Set to True to generate and sort BAM files (takes more time)
# Set to False to skip BAM generation and only get count matrices
generate_bam: False

# ── BRB-seq / STARsolo parameters ─────────────────────────────────────────────
barcode_len: 14   # V5D kit: 14 bp barcode in R2
umi_len:     14    # V5D kit: 14 bp UMI following barcode in R2

# ── Thread allocation ─────────────────────────────────────────────────────────
threads:
  star:   16
#  counts: 8
  fastqc: 2

# ── Containers (verify tags) ──────────────────────────────────────────────────
containers:
  fastqc:      "docker://quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0"
  multiqc:     "docker://quay.io/biocontainers/multiqc:1.33--pyhdfd78af_0"
  star:        "docker://quay.io/biocontainers/star:2.7.11b--h5ca1c30_8"
  python:      "docker://python:3.11.15-trixie"
  samtools:    "docker://quay.io/biocontainers/samtools:1.23--h96c455f_0"
  anaconda:    "docker://continuumio/anaconda3:main"
  r_env:       "docker://rocker/tidyverse:4.6.0"
